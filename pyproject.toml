[project]
authors = [{name = "Oleksandr Huziy", email = "oleksandr.huziy@ec.gc.ca"}]
dependencies = []
name = "surgemip"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
surgemip = { path = ".", editable = true }

[tool.pixi.tasks]
twl = "ord_soumet scripts/submit.sh -jn surgemip-twl -cpus 200 -cm 500G -args ./run_all_twl.sh"
surge = "ord_soumet scripts/submit.sh -jn surgemip-surge -cpus 200 -cm 500G -args ./run_all_surge.sh"
convert_gtsm = "ord_soumet scripts/submit_pyscript.sh -jn surgemip-convert-gtsm  -args ${PIXI_PROJECT_ROOT} src/loadprogs/tools/surgemip_convert_gtsm_nc_to_convention.py"
convert_adcirc_cfsv2 = "ord_soumet scripts/submit_pyscript.sh -jn surgemip-convert-adcirc-cfsv2  -args ${PIXI_PROJECT_ROOT} src/loadprogs/tools/surgemip_convert_nc_to_convention_gen.py"

[tool.pixi.tasks.surge_daily_max]
cmd = "ord_soumet scripts/submit.sh -jn surgemip-surge-dailymax -cpus 200 -cm 500G -args ./run_all_surge_dailymax.sh"

[tool.pixi.dependencies]
pandas = ">=3.0.5,<4"
xarray = ">=2026.7.0,<2027"
netcdf4 = ">=1.7.4,<2"
dask = ">=2026.8.0,<2027"
ipython = ">=9.17.1,<10"


[tool.pixi.feature.dev.dependencies]
ipython = "*"

[tool.pixi.environments]
dev = ["dev"]
